const { useState, useEffect, useRef } = React;

// ─── HELPERS DE ALMACENAMIENTO ────────────────────────────────────────────────
function storageGet(key, fallback) {
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
  catch { return fallback; }
}
function storageSave(key, data) {
  try { localStorage.setItem(key, JSON.stringify(data)); } catch {}
}

// ─── HELPERS DE FIREBASE ───────────────────────────────────────────────────────
function fbSnap(snap) {
  const val = snap.val();
  if (!val) return [];
  return Object.values(val).sort((a, b) => (a.id || 0) - (b.id || 0));
}
function fbSetItem(path, item) {
  return db.ref(path + '/' + item.id).set(item);
}
function fbUpdate(path, id, changes) {
  return db.ref(path + '/' + id).update(changes);
}
function fbListen(path, callback) {
  const ref = db.ref(path);
  ref.on('value', snap => callback(fbSnap(snap)));
  return () => ref.off();
}

// ─── PERFIL DEL FLETERO (sin contraseña, se guarda una sola vez) ─────────────
const KEY_FLETERO_PERFIL = 'fletar_fletero_perfil';
let _perfilFletero = null;
try { const _v = localStorage.getItem(KEY_FLETERO_PERFIL); if (_v) _perfilFletero = JSON.parse(_v); } catch {}
let USUARIO_FLETERO = _perfilFletero; // null si nunca se registró

// Identifica al fletero en OneSignal (External ID) para poder mandarle
// notificaciones push dirigidas a él específicamente desde el servidor.
function identificarFleteroEnOneSignal(id) {
  if (!id) return;
  window.OneSignalDeferred = window.OneSignalDeferred || [];
  window.OneSignalDeferred.push(async function(OneSignal) {
    try { await OneSignal.login(id); } catch (e) {}
  });
}
if (USUARIO_FLETERO?.id) identificarFleteroEnOneSignal(USUARIO_FLETERO.id);

// ─── NOTIFICACIONES (sonido + aviso en primer plano) ─────────────────────────
const _sonido = new Howl({ src: ['/notif-cliente.wav'], volume: 1.0, preload: true });
let _badgeCount = 0;

function pedirPermisoNotificaciones() {
  if ('Notification' in window && Notification.permission === 'default') {
    // Pedimos el permiso a través de OneSignal (no con la API nativa directo)
    // para que además quede registrada la suscripción push del lado de
    // OneSignal — si se pide con Notification.requestPermission() a secas,
    // el navegador queda "permitido" pero OneSignal nunca se entera y no
    // puede mandar notificaciones reales.
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    window.OneSignalDeferred.push(function(OneSignal) {
      OneSignal.Notifications.requestPermission();
    });
  }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') {
      _badgeCount = 0;
      if ('clearAppBadge' in navigator) navigator.clearAppBadge().catch(() => {});
      document.dispatchEvent(new CustomEvent('fletar-notif', { detail: { count: 0 } }));
    }
  });
}

function tocarSonido() {
  _sonido.play();
}

function mostrarNotificacion(titulo, cuerpo) {
  tocarSonido();
  _badgeCount++;
  if ('setAppBadge' in navigator) navigator.setAppBadge(_badgeCount).catch(() => {});
  document.dispatchEvent(new CustomEvent('fletar-notif', { detail: { count: _badgeCount, titulo, cuerpo } }));
  if ('serviceWorker' in navigator && Notification.permission === 'granted') {
    navigator.serviceWorker.ready.then(reg => {
      reg.showNotification(titulo, {
        body: cuerpo,
        icon: '/icon-fletero-192.png',
        badge: '/icon-fletero-192.png',
        silent: true,
      });
    }).catch(() => {});
  }
}

const VEHICULOS_FLETERO = [

// ─── UBICACIÓN (Argentina) — mismo dataset que fletar-cliente.html ───────────
const GEOREF = 'https://apis.datos.gob.ar/georef/api';
const CIUDADES_AR = [
  {ciudad:'Posadas',provincia:'Misiones',lat:-27.3671,lon:-55.8961},{ciudad:'Puerto Iguazú',provincia:'Misiones',lat:-25.5952,lon:-54.5734},
  {ciudad:'Oberá',provincia:'Misiones',lat:-27.4881,lon:-55.1200},{ciudad:'Eldorado',provincia:'Misiones',lat:-26.4008,lon:-54.6420},
  {ciudad:'Apóstoles',provincia:'Misiones',lat:-27.9074,lon:-55.7565},{ciudad:'Bernardo de Irigoyen',provincia:'Misiones',lat:-26.2540,lon:-53.6427},
  {ciudad:'San Vicente',provincia:'Misiones',lat:-26.9576,lon:-54.9930},{ciudad:'Leandro N. Alem',provincia:'Misiones',lat:-27.5997,lon:-55.3320},
  {ciudad:'Corrientes',provincia:'Corrientes',lat:-27.4692,lon:-58.8306},{ciudad:'Goya',provincia:'Corrientes',lat:-29.1391,lon:-59.2666},
  {ciudad:'Resistencia',provincia:'Chaco',lat:-27.4512,lon:-58.9867},{ciudad:'Formosa',provincia:'Formosa',lat:-26.1849,lon:-58.1731},
  {ciudad:'Buenos Aires',provincia:'CABA',lat:-34.6037,lon:-58.3816},{ciudad:'Rosario',provincia:'Santa Fe',lat:-32.9468,lon:-60.6393},
  {ciudad:'Córdoba',provincia:'Córdoba',lat:-31.4201,lon:-64.1888},{ciudad:'Mendoza',provincia:'Mendoza',lat:-32.8895,lon:-68.8458},
  {ciudad:'La Plata',provincia:'Buenos Aires',lat:-34.9214,lon:-57.9544},{ciudad:'Mar del Plata',provincia:'Buenos Aires',lat:-38.0055,lon:-57.5426},
  {ciudad:'San Miguel de Tucumán',provincia:'Tucumán',lat:-26.8241,lon:-65.2226},{ciudad:'Salta',provincia:'Salta',lat:-24.7859,lon:-65.4117},
  {ciudad:'Santa Fe',provincia:'Santa Fe',lat:-31.6333,lon:-60.7000},{ciudad:'San Juan',provincia:'San Juan',lat:-31.5375,lon:-68.5364},
  {ciudad:'Neuquén',provincia:'Neuquén',lat:-38.9516,lon:-68.0591},{ciudad:'Bahía Blanca',provincia:'Buenos Aires',lat:-38.7183,lon:-62.2663},
  {ciudad:'Paraná',provincia:'Entre Ríos',lat:-31.7333,lon:-60.5238},{ciudad:'Concepción del Uruguay',provincia:'Entre Ríos',lat:-32.4825,lon:-58.2372},
  {ciudad:'Concordia',provincia:'Entre Ríos',lat:-31.3928,lon:-58.0209},{ciudad:'Paso de los Libres',provincia:'Corrientes',lat:-29.7000,lon:-57.0900},
].map(c => ({ ...c, label: `${c.ciudad}, ${c.provincia}` }));

// Distancia real entre dos puntos (fórmula de Haversine), usada para el radio
// de 30 km que separa envíos de fletero particular de cargas de larga distancia.
function distKm(lat1, lon1, lat2, lon2) {
  if (lat1 == null || lon1 == null || lat2 == null || lon2 == null) return null;
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(a));
}

// Un pedido es "de fletero particular" si el origen está a menos de 30 km de
// la ciudad del fletero Y el viaje completo (origen → destino) no supera esos
// 30 km — mismo criterio usado en PedidosDisponibles, compartido acá para que
// el aviso de sonido use exactamente la misma regla.
const RADIO_FLETERO_KM = 30;
function pedidoEsElegibleParaFletero(c, fletero) {
  const tieneCoords = c.origenLat != null && c.origenLon != null && c.destinoLat != null && c.destinoLon != null
    && fletero?.lat != null && fletero?.lon != null;
  if (tieneCoords) {
    const distFleteroOrigen = distKm(fletero.lat, fletero.lon, c.origenLat, c.origenLon);
    const distViaje = distKm(c.origenLat, c.origenLon, c.destinoLat, c.destinoLon);
    return distFleteroOrigen <= RADIO_FLETERO_KM && distViaje <= RADIO_FLETERO_KM;
  }
  return normCiudad(c.ciudad) === normCiudad(fletero?.ciudad);
}

function normStr(s) {
  return (s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
}
// GeoRef y Nominatim a veces devuelven el nombre oficial del municipio
// ("Municipio de Posadas") en vez del nombre de la ciudad a secas ("Posadas").
// Sacamos ese prefijo para que coincida con el resto de la app.
function limpiarCiudad(nombre) {
  return (nombre || '').replace(/^(Municipio|Comuna|Partido|Departamento) de /i, '').trim();
}
function normCiudad(s) {
  return normStr(limpiarCiudad(s));
}
function normProvDisplay(nombre) {
  if (!nombre) return '';
  if (normStr(nombre).includes('autonoma') || normStr(nombre).includes('autónoma')) return 'CABA';
  return nombre.replace(/^Provincia de /i, '').trim();
}
function normProvGPS(raw) {
  return normProvDisplay((raw || '').replace(/ Province$/i, '').replace(/ \(Argentina\)$/i, '').trim());
}

function CiudadAutocomplete({ value = "", onChange, label, placeholder, mostrarGPS = false, required = false }) {
  const [inputVal, setInputVal]     = React.useState(value);
  const [sug, setSug]               = React.useState([]);
  const [busy, setBusy]             = React.useState(false);
  const [gpsLoad, setGpsLoad]       = React.useState(false);
  const [open, setOpen]             = React.useState(false);
  const timer = React.useRef(null);
  const gpsProvincia = React.useRef(null);
  const gpsDisponible = mostrarGPS && !!navigator.geolocation;

  function buscar(q) {
    clearTimeout(timer.current);
    if (q.length < 2) { setSug([]); setOpen(false); return; }
    const provinciaGPS = gpsProvincia.current;
    const qn = normStr(q);
    const inmediatas = CIUDADES_AR.filter(c => normStr(c.ciudad).includes(qn))
      .sort((a, b) => (normStr(a.ciudad).startsWith(qn) ? 0 : 1) - (normStr(b.ciudad).startsWith(qn) ? 0 : 1))
      .slice(0, 6);
    if (inmediatas.length > 0) { setSug(inmediatas); setOpen(true); }

    timer.current = setTimeout(() => {
      setBusy(true);
      const procesarResultados = (items) => {
        const seen = new Set();
        return items
          .map(loc => {
            const c = limpiarCiudad(loc.ciudad || loc.nombre || '');
            const p = loc.provincia || normProvDisplay(loc.provincia?.nombre || '');
            if (!c || !p) return null;
            const label = `${c}, ${p}`;
            return { label, ciudad: c, provincia: p, lat: loc.lat, lon: loc.lon };
          })
          .filter(r => {
            if (!r || !normStr(r.ciudad).includes(qn)) return false;
            if (seen.has(r.label)) return false;
            seen.add(r.label); return true;
          })
          .sort((a, b) => {
            if (provinciaGPS) {
              const aL = normStr(a.provincia) === normStr(provinciaGPS) ? 0 : 1;
              const bL = normStr(b.provincia) === normStr(provinciaGPS) ? 0 : 1;
              if (aL !== bL) return aL - bL;
            }
            return (normStr(a.ciudad).startsWith(qn) ? 0 : 1) - (normStr(b.ciudad).startsWith(qn) ? 0 : 1);
          });
      };
      const fallbackNominatim = () =>
        fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q)},Argentina&format=json&limit=10&countrycodes=ar&addressdetails=1`)
          .then(r => r.json())
          .then(data => {
            const items = (data || []).map(d => ({
              ciudad: limpiarCiudad(d.address?.city || d.address?.town || d.address?.village || d.name || ''),
              provincia: normProvGPS(d.address?.state || ''),
              lat: d.lat != null ? parseFloat(d.lat) : null,
              lon: d.lon != null ? parseFloat(d.lon) : null,
            }));
            const res = procesarResultados(items);
            setSug(res.length > 0 ? res : inmediatas);
            setOpen(res.length > 0 || inmediatas.length > 0);
            setBusy(false);
          })
          .catch(() => { setSug(inmediatas); setOpen(inmediatas.length > 0); setBusy(false); });

      fetch(`${GEOREF}/localidades?nombre=${encodeURIComponent(q)}&max=15&campos=nombre,provincia,centroide`)
        .then(r => r.ok ? r.json() : Promise.reject())
        .then(data => {
          const locs = (data.localidades || []).map(loc => ({
            ciudad: loc.nombre || '',
            provincia: normProvDisplay(loc.provincia?.nombre || ''),
            lat: loc.centroide?.lat ?? null,
            lon: loc.centroide?.lon ?? null,
          }));
          const res = procesarResultados(locs);
          if (res.length > 0) { setSug(res); setOpen(true); setBusy(false); }
          else fallbackNominatim();
        })
        .catch(fallbackNominatim);
    }, 350);
  }

  function sel(item) {
    setInputVal(item.label);
    onChange(item.ciudad, item.provincia, item.lat ?? null, item.lon ?? null);
    setSug([]); setOpen(false);
  }

  function gps() {
    setGpsLoad(true);
    navigator.geolocation.getCurrentPosition(
      pos => {
        fetch(`https://nominatim.openstreetmap.org/reverse?lat=${pos.coords.latitude}&lon=${pos.coords.longitude}&format=json&addressdetails=1`)
          .then(r => r.json())
          .then(d => {
            const a = d.address;
            const ciudad = limpiarCiudad(a.city || a.town || a.village || a.suburb || '');
            const prov = normProvGPS(a.state || '');
            gpsProvincia.current = prov;
            if (ciudad) { setInputVal(`${ciudad}, ${prov}`); onChange(ciudad, prov, pos.coords.latitude, pos.coords.longitude); }
            setGpsLoad(false);
          })
          .catch(() => setGpsLoad(false));
      },
      () => { setGpsLoad(false); },
      { timeout: 10000, enableHighAccuracy: false }
    );
  }

  return (
    <div style={{ position: "relative" }}>
      {label && <label style={{ display:"block", fontWeight:500, marginBottom:5, fontSize:13, color:"#444" }}>{label}{required && " *"}</label>}
      <div style={{ display:"flex", gap:6 }}>
        <div style={{ position:"relative", flex:1 }}>
          <input
            value={inputVal}
            onChange={e => { setInputVal(e.target.value); buscar(e.target.value); }}
            onBlur={() => setTimeout(() => setOpen(false), 160)}
            onFocus={() => sug.length > 0 && setOpen(true)}
            placeholder={placeholder || "Escribí la ciudad..."}
            autoComplete="off"
            style={{ paddingRight: busy ? 30 : undefined }}
          />
          {busy && <span style={{ position:"absolute", right:8, top:"50%", transform:"translateY(-50%)", fontSize:13, color:"#bbb", pointerEvents:"none" }}>🔍</span>}
        </div>
        {gpsDisponible && (
          <button type="button" onClick={gps} disabled={gpsLoad}
            title="Detectar mi ubicación actual"
            style={{ padding:"0 12px", background:gpsLoad?"#F5F5F5":"var(--azul-light)", border:"1.5px solid #B5D4F4", borderRadius:8, cursor:gpsLoad?"wait":"pointer", color:"var(--azul-dark)", fontSize:18, flexShrink:0, display:"flex", alignItems:"center", justifyContent:"center", minWidth:44 }}>
            {gpsLoad ? "⏳" : "📍"}
          </button>
        )}
      </div>
      {open && sug.length > 0 && (
        <div style={{ position:"absolute", top:"100%", left:0, right:0, background:"#fff", border:"1.5px solid #DDE3EA", borderRadius:10, boxShadow:"0 8px 24px rgba(0,0,0,0.11)", zIndex:500, marginTop:4, overflow:"hidden" }}>
          {sug.map((s,i) => (
            <div key={i}
              onMouseDown={e => { e.preventDefault(); sel(s); }}
              style={{ padding:"10px 14px", cursor:"pointer", fontSize:13, borderBottom:i<sug.length-1?"1px solid #F5F5F5":"none", display:"flex", alignItems:"center", gap:8 }}
              onMouseEnter={e => e.currentTarget.style.background="#F5F9FF"}
              onMouseLeave={e => e.currentTarget.style.background="#fff"}>
              <span style={{color:"var(--azul)"}}>📍</span>
              <div>
                <span style={{fontWeight:500,color:"#1A1A1A"}}>{s.ciudad}</span>
                {s.provincia && <span style={{color:"#888",marginLeft:6,fontSize:12}}>{s.provincia}</span>}
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function FletarLogo({ size = "sm" }) {
  const iconSize = size === "lg" ? 52 : 34;
  const textW = size === "lg" ? 140 : 110;
  const textH = size === "lg" ? 46 : 36;
  const fontSize = size === "lg" ? 42 : 32;
  return (
    <div style={{ display: "flex", alignItems: "center", gap: size === "lg" ? 12 : 8 }}>
      <svg width={iconSize} height={iconSize} viewBox="0 0 38 38">
        <rect width="38" height="38" rx="9" fill="#E85D20"/>
        <text fontFamily="Montserrat, sans-serif" fontSize="26" fontWeight="900" x="7" y="28" fill="white">F</text>
        <polygon points="28,24 34,19 28,14 28,18 22,18 22,20 28,20" fill="white" opacity="0.9"/>
      </svg>
      <svg width={textW} height={textH} viewBox={`0 0 ${textW} ${textH}`}>
        <defs>
          <clipPath id="cl-left"><polygon points={`0,${textH} 0,0 ${textW * 0.58},0 ${textW * 0.36},${textH}`}/></clipPath>
          <clipPath id="cl-right"><polygon points={`${textW * 0.58},0 ${textW},0 ${textW},${textH} ${textW * 0.36},${textH}`}/></clipPath>
        </defs>
        <text fontFamily="Montserrat, sans-serif" fontSize={fontSize} fontWeight="900" y={textH - 4} clipPath="url(#cl-left)" fill="#E85D20">fletar</text>
        <text fontFamily="Montserrat, sans-serif" fontSize={fontSize} fontWeight="900" y={textH - 4} clipPath="url(#cl-right)" fill="white">fletar</text>
      </svg>
    </div>
  );
}

function BotonGoogle({ onClick, cargando }) {
  return (
    <button type="button" onClick={onClick} disabled={cargando} style={{ background: "#fff", border: "1.5px solid #ddd", borderRadius: 10, padding: "13px 16px", cursor: cargando ? "default" : "pointer", display: "flex", alignItems: "center", justifyContent: "center", gap: 10, fontSize: 14, fontWeight: 600, color: "#3c4043", width: "100%", boxSizing: "border-box", opacity: cargando ? 0.6 : 1 }}>
      <GoogleIcon />
      {cargando ? "Conectando…" : "Continuar con Google"}
    </button>
  );
}
function LoginFletero({ onBack, onLogueado, onGoogle, cargandoGoogle, errorGoogle }) {
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [error, setError] = useState("");
  const [cargando, setCargando] = useState(false);
  const [recuperoEnviado, setRecuperoEnviado] = useState(false);

  async function ingresar() {
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.trim())) { setError("Ingresá un email válido."); return; }
    if (!password) { setError("Ingresá tu contraseña."); return; }
    setError(""); setCargando(true);
    try {
      const cred = await firebase.auth().signInWithEmailAndPassword(email.trim(), password);
      const uid = cred.user.uid;
      const idSnap = await db.ref(`fleterosPorUid/${uid}`).get();
      if (!idSnap.exists()) { setError("No encontramos tu perfil. Escribinos a soporte@fletar.app."); setCargando(false); return; }
      const perfilSnap = await db.ref(`fleteros/${idSnap.val()}`).get();
      if (!perfilSnap.exists()) { setError("No encontramos tu perfil. Escribinos a soporte@fletar.app."); setCargando(false); return; }
      onLogueado(perfilSnap.val());
    } catch (e) {
      setCargando(false);
      setError(e.code === 'auth/invalid-credential' || e.code === 'auth/wrong-password' || e.code === 'auth/user-not-found' ? "Email o contraseña incorrectos." : "No pudimos iniciar sesión. Probá de nuevo.");
    }
  }

  async function recuperar() {
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.trim())) { setError("Escribí tu email arriba para mandarte el link."); return; }
    try { await firebase.auth().sendPasswordResetEmail(email.trim()); setRecuperoEnviado(true); setError(""); }
    catch (e) { setError("No pudimos enviar el email. Revisá que esté bien escrito."); }
  }

  return (
    <div style={{ minHeight: "100vh", display: "flex", flexDirection: "column" }}>
      <div style={{ background: "#2C2C2A", flex: "0 0 26%", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", padding: "32px 24px" }}>
        <FletarLogo size="lg" />
      </div>
      <div style={{ background: "#fff", flex: 1, borderRadius: "24px 24px 0 0", marginTop: -20, padding: "32px 24px 40px" }}>
        <div style={{ maxWidth: 420, margin: "0 auto" }}>
          <button onClick={onBack} style={{ background: "none", border: "none", color: "#888", fontSize: 13, cursor: "pointer", padding: 0, marginBottom: 14 }}>← Volver</button>
          <h1 style={{ fontSize: 19, fontWeight: 700, marginBottom: 4 }}>Iniciar sesión</h1>
          <p style={{ fontSize: 13, color: "#888", marginBottom: 18 }}>Entrá con el email y la contraseña con la que te registraste.</p>
          <BotonGoogle onClick={onGoogle} cargando={cargandoGoogle} />
          {errorGoogle && <p style={{ fontSize: 12.5, color: "#c0392b", textAlign: "center", marginTop: 8 }}>{errorGoogle}</p>}
          <div style={{ display: "flex", alignItems: "center", gap: 10, margin: "18px 0" }}>
            <div style={{ flex: 1, height: 1, background: "#eee" }} />
            <span style={{ fontSize: 12, color: "#aaa" }}>o con email</span>
            <div style={{ flex: 1, height: 1, background: "#eee" }} />
          </div>
          <div className="form-group">
            <label>Email</label>
            <input type="email" value={email} onChange={e => setEmail(e.target.value)} placeholder="tu@email.com" />
          </div>
          <div className="form-group">
            <label>Contraseña</label>
            <PasswordInput value={password} onChange={e => setPassword(e.target.value)} placeholder="Tu contraseña" />
          </div>
          <button onClick={recuperar} style={{ background: "none", border: "none", color: "var(--azul)", fontSize: 12.5, cursor: "pointer", padding: 0, marginBottom: 16 }}>¿Olvidaste tu contraseña?</button>
          {recuperoEnviado && <p style={{ fontSize: 12.5, color: "#0F6E56", marginBottom: 14 }}>✅ Te mandamos un email para elegir una nueva contraseña.</p>}
          {error && <p style={{ fontSize: 12.5, color: "#c0392b", marginBottom: 14 }}>{error}</p>}
          <button className="btn-primary" style={{ width: "100%", padding: "13px 0", fontSize: 15 }} onClick={ingresar} disabled={cargando}>{cargando ? "Ingresando…" : "Ingresar"}</button>
        </div>
      </div>
    </div>
  );
}

function RegistroFletero({ onListo, onLogueado }) {
  const [modo, setModo] = useState("registro"); // 'registro' | 'login'
  const [form, setForm] = useState({ nombre: "", email: "", password: "", password2: "", telefono: "", ciudad: "", provincia: "", lat: null, lon: null, vehiculo: VEHICULOS_FLETERO[0] });
  const [error, setError] = useState("");
  const [google, setGoogle] = useState(null); // { uid, email }
  const [cargandoGoogle, setCargandoGoogle] = useState(false);
  const [errorGoogle, setErrorGoogle] = useState("");
  const setF = (k, v) => setForm(f => ({ ...f, [k]: v }));

  const [verificandoRedirect, setVerificandoRedirect] = useState(true);

  async function procesarUsuarioGoogle(user) {
    const uid = user.uid;
    const idSnap = await db.ref(`fleterosPorUid/${uid}`).get();
    if (idSnap.exists()) {
      const perfilSnap = await db.ref(`fleteros/${idSnap.val()}`).get();
      if (perfilSnap.exists()) {
        onLogueado(perfilSnap.val());
        return;
      }
    }
    // Cuenta nueva: prellenamos nombre/email y saltamos la contraseña
    setGoogle({ uid, email: user.email || "" });
    setForm(f => ({ ...f, nombre: user.displayName || f.nombre, email: user.email || f.email }));
    setModo("registro");
  }

  // Al volver de la pantalla de Google (signInWithRedirect navega afuera y
  // vuelve a esta misma página), hay que revisar si venimos de ese regreso.
  useEffect(() => {
    firebase.auth().getRedirectResult()
      .then(result => {
        if (result && result.user) {
          setCargandoGoogle(true);
          return procesarUsuarioGoogle(result.user).finally(() => setCargandoGoogle(false));
        }
      })
      .catch(() => setErrorGoogle("No pudimos continuar con Google. Probá de nuevo."))
      .finally(() => setVerificandoRedirect(false));
  }, []);

  function handleGoogle() {
    setErrorGoogle("");
    const provider = new firebase.auth.GoogleAuthProvider();
    firebase.auth().signInWithRedirect(provider);
    // La página navega afuera acá — el resultado se procesa arriba, al volver.
  }

  if (verificandoRedirect) {
    return <div style={{ minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center" }}><p style={{ color: "#888", fontSize: 13 }}>Cargando…</p></div>;
  }

  if (modo === "login") {
    return <LoginFletero onBack={() => setModo("registro")} onLogueado={onLogueado} onGoogle={handleGoogle} cargandoGoogle={cargandoGoogle} errorGoogle={errorGoogle} />;
  }

  async function enviar() {
    if (!form.nombre || !form.telefono || !form.ciudad) {
      setError("Completá tu nombre, teléfono y ciudad para continuar."); return;
    }
    if (!google) {
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test((form.email || "").trim())) {
        setError("Ingresá un email válido — lo vas a necesitar para recuperar tu cuenta."); return;
      }
      if (!form.password || form.password.length < 6) { setError("La contraseña tiene que tener al menos 6 caracteres."); return; }
      if (form.password !== form.password2) { setError("Las contraseñas no coinciden."); return; }
    }
    setError("");
    try {
      let uid;
      if (google) {
        uid = google.uid;
      } else {
        const cred = await firebase.auth().createUserWithEmailAndPassword(form.email.trim(), form.password);
        uid = cred.user.uid;
      }
      const id = 'flt-' + form.telefono.replace(/\D/g, '') + '-' + Date.now().toString(36);
      const { password, password2, ...formSinPassword } = form;
      const perfil = { ...formSinPassword, id, authUid: uid, creadoEn: Date.now() };
      USUARIO_FLETERO = perfil;
      storageSave(KEY_FLETERO_PERFIL, perfil);
      await db.ref(`fleteros/${id}`).set(perfil);
      await db.ref(`fleterosPorUid/${uid}`).set(id);
      identificarFleteroEnOneSignal(id);
      onListo(perfil);
    } catch (e) {
      setError(e.code === 'auth/email-already-in-use' ? 'Ese email ya tiene una cuenta. Tocá "Ya tengo cuenta" abajo.' : "No pudimos crear tu cuenta. Probá de nuevo en un momento.");
    }
  }

  return (
    <div style={{ minHeight: "100vh", display: "flex", flexDirection: "column" }}>
      <div style={{ background: "#2C2C2A", flex: "0 0 34%", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", padding: "40px 24px 48px" }}>
        <FletarLogo size="lg" />
        <p style={{ fontSize: 15, color: "rgba(255,255,255,0.85)", marginTop: 16, textAlign: "center" }}>Ganá un ingreso extra con tu vehículo</p>
      </div>
      <div style={{ background: "#fff", flex: 1, borderRadius: "24px 24px 0 0", marginTop: -20, padding: "32px 24px 40px" }}>
        <div style={{ maxWidth: 420, margin: "0 auto" }}>
          <h1 style={{ fontSize: 19, fontWeight: 700, marginBottom: 4 }}>Registrate como fletero</h1>
          <p style={{ fontSize: 13, color: "#888", marginBottom: 18 }}>Es gratis, te lleva un minuto.</p>

          {!google && (
            <>
              <BotonGoogle onClick={handleGoogle} cargando={cargandoGoogle} />
              {errorGoogle && <p style={{ fontSize: 12.5, color: "#c0392b", textAlign: "center", marginTop: 8 }}>{errorGoogle}</p>}
              <div style={{ display: "flex", alignItems: "center", gap: 10, margin: "18px 0" }}>
                <div style={{ flex: 1, height: 1, background: "#eee" }} />
                <span style={{ fontSize: 12, color: "#aaa" }}>o con email</span>
                <div style={{ flex: 1, height: 1, background: "#eee" }} />
              </div>
            </>
          )}

          <div className="form-group">
            <label>Nombre y apellido</label>
            <input value={form.nombre} onChange={e => setF('nombre', e.target.value)} placeholder="Ej: Juan Pérez" />
          </div>
          <div className="form-group">
            <label>Email {google ? "" : "* (para recuperar tu cuenta más adelante)"}</label>
            <input type="email" value={form.email} onChange={e => setF('email', e.target.value)} placeholder="juan@email.com" disabled={!!google} style={google ? { background: "#f0f0f0", color: "#888" } : undefined} />
            {google && <p style={{ fontSize: 11, color: "#0F6E56", marginTop: 4 }}>✅ Usando el email de tu cuenta de Google.</p>}
          </div>
          {!google && (
            <>
              <div className="form-group">
                <label>Contraseña *</label>
                <PasswordInput value={form.password} onChange={e => setF('password', e.target.value)} placeholder="Al menos 6 caracteres" />
              </div>
              <div className="form-group">
                <label>Repetir contraseña *</label>
                <PasswordInput value={form.password2} onChange={e => setF('password2', e.target.value)} placeholder="Repetí tu contraseña" />
              </div>
            </>
          )}
          <div className="form-group">
            <label>Teléfono / WhatsApp</label>
            <input type="tel" value={form.telefono} onChange={e => setF('telefono', e.target.value)} placeholder="Ej: 3764 123456" />
          </div>
          <div className="form-group">
            <CiudadAutocomplete
              label="Tu ciudad" required
              value={form.ciudad ? `${form.ciudad}${form.provincia ? ", " + form.provincia : ""}` : ""}
              onChange={(ciudad, prov, lat, lon) => { setF('ciudad', ciudad); setF('provincia', prov); setF('lat', lat ?? null); setF('lon', lon ?? null); }}
              mostrarGPS={true}
              placeholder="Ej: Posadas, Misiones"
            />
            <p style={{ fontSize: 11, color: "#888", marginTop: 4 }}>Vas a ver los pedidos a menos de 30 km de tu ciudad.</p>
          </div>
          <div className="form-group" style={{ marginBottom: 14 }}>
            <label>Tu vehículo</label>
            <select value={form.vehiculo} onChange={e => setF('vehiculo', e.target.value)}>
              {VEHICULOS_FLETERO.map(v => <option key={v}>{v}</option>)}
            </select>
          </div>
          {error && <p style={{ fontSize: 12.5, color: "#c0392b", marginBottom: 14 }}>{error}</p>}
          <button className="btn-primary" style={{ width: "100%", padding: "13px 0", fontSize: 15 }} onClick={enviar}>Empezar</button>
          <button onClick={() => setModo("login")} style={{ background: "none", border: "none", color: "#888", fontSize: 13, marginTop: 16, cursor: "pointer", width: "100%", textAlign: "center" }}>
            Ya tengo cuenta — <span style={{ color: "var(--azul)", fontWeight: 600 }}>iniciar sesión</span>
          </button>
        </div>
      </div>
    </div>
  );
}

// ─── PEDIDOS DISPONIBLES ───────────────────────────────────────────────────────
function PedidosDisponibles({ onNav, onCotizar }) {
  const [cargas, setCargas] = useState([]);
  const [ofertas, setOfertas] = useState([]);

  useEffect(() => {
    const unsubC = fbListen('cargas', arr => setCargas(arr));
    const unsubO = fbListen('ofertas', arr => setOfertas(arr));
    return () => { unsubC(); unsubO(); };
  }, []);

  const misOfertasIds = new Set(ofertas.filter(o => o.fleteroId === USUARIO_FLETERO?.id).map(o => o.cargaId));

  // Los pedidos viejos, publicados antes de guardar coordenadas, siguen
  // usando el match por nombre de ciudad como respaldo (ver pedidoEsElegibleParaFletero).
  const disponibles = cargas
    .filter(c => c.tipoEnvio === "expres-local")
    .filter(c => ["nueva", "activo"].includes(c.estado))
    .filter(c => pedidoEsElegibleParaFletero(c, USUARIO_FLETERO))
    .filter(c => !misOfertasIds.has(c.id))
    .sort((a, b) => b.id - a.id);

  return (
    <div style={{ maxWidth: 680, margin: "0 auto", padding: "24px 16px" }}>
      <h1 style={{ fontSize: 20, fontWeight: 600, marginBottom: 4 }}>Pedidos disponibles</h1>
      <p style={{ fontSize: 13, color: "#888", marginBottom: 20 }}>A menos de 30 km de {USUARIO_FLETERO?.ciudad || "tu ciudad"}</p>

      {disponibles.length === 0 && (
        <div className="card" style={{ textAlign: "center", padding: 40, color: "#aaa" }}>
          <div style={{ fontSize: 32, marginBottom: 8 }}>📭</div>
          Todavía no hay pedidos en tu zona.<br/>Te vamos a avisar apenas aparezca uno.
        </div>
      )}

      <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
        {disponibles.map(c => (
          <div key={c.id} className="card">
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 8, gap: 8 }}>
              <div>
                <span className={`badge ${c.estado === "activo" ? "badge-activo" : "badge-nueva"}`}>{c.tipo}</span>
              </div>
              <div style={{ fontSize: 11, color: "#aaa" }}>{c.ofertas || 0} cotizaci{c.ofertas === 1 ? "ón" : "ones"}</div>
            </div>
            {c.descripcion && <div style={{ fontSize: 13, color: "#444", marginBottom: 10 }}>{c.descripcion}</div>}
            <div style={{ fontSize: 12.5, color: "#5A6A78", marginBottom: 4 }}>📍 Retiro: {c.direccionRetiro || c.origen}</div>
            <div style={{ fontSize: 12.5, color: "#5A6A78", marginBottom: 10 }}>🏁 Entrega: {c.destino}</div>
            <div style={{ fontSize: 12, color: "#888", marginBottom: 12 }}>🗓️ {c.fechaDeseada} {c.horaDeseada && `· ${c.horaDeseada}hs`}</div>
            <button className="btn-primary" style={{ width: "100%" }} onClick={() => onCotizar(c)}>Cotizar</button>
          </div>
        ))}
      </div>
    </div>
  );
}

// ─── COTIZAR PEDIDO ────────────────────────────────────────────────────────────
function CotizarPedido({ carga, onNav }) {
  const [form, setForm] = useState({ precio: "", nota: "" });
  const [enviado, setEnviado] = useState(false);

  function enviarCotizacion() {
    if (!form.precio) { alert("Ingresá un precio."); return; }
    const nuevaOferta = {
      id: Date.now(),
      cargaId: carga.id,
      clienteId: carga.empresaId || null,
      clienteNombre: carga.empresa || null,
      esFletero: true,
      fleteroId: USUARIO_FLETERO.id,
      fleteroNombre: USUARIO_FLETERO.nombre,
      fleteroTelefono: USUARIO_FLETERO.telefono,
      // mismos nombres de campo que usa una oferta de transportista, para
      // reutilizar sin cambios la pantalla "Ver ofertas" del cliente
      transportistaId: USUARIO_FLETERO.id,
      transportistaNombre: USUARIO_FLETERO.nombre,
      calificacion: null,
      viajes: 0,
      verificado: false,
      vehiculo: USUARIO_FLETERO.vehiculo,
      foto: (USUARIO_FLETERO.nombre || "?")[0].toUpperCase(),
      precio: parseInt(form.precio),
      retiro: carga.fechaDeseada ? `${carga.fechaDeseada}${carga.horaDeseada ? " " + carga.horaDeseada + "hs" : ""}` : "A coordinar",
      entrega: "El mismo día",
      nota: form.nota,
      matchRuta: false,
    };
    fbSetItem('ofertas', nuevaOferta);
    db.ref('cargas/' + carga.id + '/ofertas').transaction(n => (n || 0) + 1);
    if (carga.estado === "nueva") fbUpdate('cargas', carga.id, { estado: "activo" });
    setEnviado(true);
    setTimeout(() => onNav("pedidos-disponibles"), 2200);
  }

  if (enviado) return (
    <div style={{ minHeight: "60vh", display: "flex", alignItems: "center", justifyContent: "center" }}>
      <div style={{ textAlign: "center", maxWidth: 360 }}>
        <div style={{ fontSize: 56 }}>✅</div>
        <h2 style={{ marginTop: 12, fontSize: 20 }}>¡Cotización enviada!</h2>
        <p style={{ color: "#888", marginTop: 8, fontSize: 14 }}>Te avisamos si el cliente la acepta.</p>
      </div>
    </div>
  );

  return (
    <div style={{ maxWidth: 480, margin: "0 auto", padding: "24px 16px" }}>
      <button className="btn-ghost" style={{ marginBottom: 12, padding: "6px 0" }} onClick={() => onNav("pedidos-disponibles")}>← Volver</button>
      <div className="card">
        <h2 style={{ fontSize: 17, fontWeight: 600, marginBottom: 4 }}>{carga.tipo}</h2>
        <p style={{ fontSize: 13, color: "#888", marginBottom: 16 }}>{carga.descripcion}</p>
        <div className="divider"></div>
        <div className="form-group" style={{ marginTop: 14 }}>
          <label>Tu precio</label>
          <div style={{ position: "relative" }}>
            <span style={{ position: "absolute", left: 12, top: "50%", transform: "translateY(-50%)", color: "#666", fontWeight: 500 }}>$</span>
            <input type="number" inputMode="numeric" value={form.precio} onChange={e => setForm(f => ({ ...f, precio: e.target.value }))} placeholder="8000" style={{ paddingLeft: 28, fontSize: 18, fontWeight: 600 }} />
          </div>
          {form.precio && parseInt(form.precio) > 0 && (
            <div style={{ marginTop: 8, background: "#E8F5E9", borderRadius: 8, padding: "10px 14px", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
              <span style={{ fontSize: 13, color: "#2E7D32" }}>Tu precio</span>
              <span style={{ fontSize: 18, fontWeight: 700, color: "#1B5E20" }}>${parseInt(form.precio).toLocaleString('es-AR')}</span>
            </div>
          )}
        </div>
        <div className="form-group" style={{ marginBottom: 0 }}>
          <label>Nota (opcional)</label>
          <input value={form.nota} onChange={e => setForm(f => ({ ...f, nota: e.target.value }))} placeholder="Ej: puedo pasar hoy a la tarde" />
        </div>
      </div>
      <button className="btn-primary" style={{ width: "100%", marginTop: 16, padding: "13px 0", fontSize: 15 }} onClick={enviarCotizacion}>Enviar cotización</button>
    </div>
  );
}

// Arma un link de Google Maps que busca una dirección + ciudad — mismo
// patrón que ya usa fletar-chofer.html, para que el fletero pueda abrir la
// navegación con un toque en vez de tener que copiar/pegar nada.
function mapsUrl(domicilio, ciudad) {
  if (!domicilio) return null;
  return `https://maps.google.com/?q=${encodeURIComponent((domicilio || '') + ' ' + (ciudad || ''))}`;
}

// ─── CARTEL DE CONFIRMACIÓN (amigable, con logo Fletar) ──────────────────────
function ConfirmModal({ titulo, subtitulo, textoBoton, onConfirmar, onCancelar }) {

    <div style={{ position: "fixed", top: 0, left: 0, right: 0, bottom: 0, background: "rgba(0,0,0,0.5)", zIndex: 300, display: "flex", alignItems: "center", justifyContent: "center", padding: 20 }}>
      <div style={{ background: "#fff", borderRadius: 16, padding: "22px 20px", width: "100%", maxWidth: 320, textAlign: "center" }}>
        <svg width={48} height={48} viewBox="0 0 38 38" style={{ margin: "0 auto 14px", display: "block" }}>
          <rect width="38" height="38" rx="9" fill="#E85D20"/>
          <text fontFamily="Montserrat, sans-serif" fontSize="26" fontWeight="900" x="7" y="28" fill="white">F</text>
          <polygon points="28,24 34,19 28,14 28,18 22,18 22,20 28,20" fill="white" opacity="0.9"/>
        </svg>
        <div style={{ fontSize: 15, fontWeight: 500, color: "#1A1A1A", marginBottom: 6 }}>{titulo}</div>
        {subtitulo && <div style={{ fontSize: 12, color: "#5A6A78", marginBottom: 18 }}>{subtitulo}</div>}
        <button onClick={onConfirmar} style={{ width: "100%", background: "#639922", color: "#fff", border: "none", borderRadius: 8, padding: "11px 0", fontSize: 13.5, fontWeight: 500, cursor: "pointer", marginBottom: 8 }}>{textoBoton}</button>
        <button onClick={onCancelar} style={{ width: "100%", background: "transparent", border: "none", color: "#9aa5b1", fontSize: 12.5, padding: "4px 0", cursor: "pointer" }}>Cancelar</button>
      </div>
    </div>
  );
}

// ─── GUÍA INICIAL (aparece una sola vez, primera vez que se entra) ───────────
const KEY_TUTORIAL_FLETERO = 'fletar_fletero_tutorial_visto';
const PASOS_TUTORIAL_FLETERO = [
  { icono: "📍", titulo: "Pedidos cerca tuyo", texto: "Vas a ver los pedidos exprés disponibles en tu ciudad, a menos de 30km." },
  { icono: "💬", titulo: "Cotizá un pedido", texto: "Elegís uno y proponés tu precio. El cliente decide si te lo acepta." },
  { icono: "🚚", titulo: "Retirá y entregá", texto: "Cuando te acepten, marcás cuando salís a retirar y cuando entregás." },
  { icono: "🗂️", titulo: "Tu historial", texto: "En \"Mis trabajos\" ves todo lo que tenés en curso y lo ya entregado." },
];
function TutorialInicial({ pasos, onCerrar }) {
  const [paso, setPaso] = useState(0);
  const actual = pasos[paso];
  const ultimo = paso === pasos.length - 1;
  return (
    <div style={{ position: "fixed", top: 0, left: 0, right: 0, bottom: 0, background: "rgba(0,0,0,0.5)", zIndex: 400, display: "flex", alignItems: "center", justifyContent: "center", padding: 20 }}>
      <div style={{ background: "#fff", borderRadius: 16, padding: "22px 20px", width: "100%", maxWidth: 320 }}>
        <div style={{ display: "flex", gap: 6, marginBottom: 20 }}>
          {pasos.map((_, i) => (
            <div key={i} style={{ height: 3, flex: 1, borderRadius: 2, background: i <= paso ? "#E85D20" : "#EEE" }} />
          ))}
        </div>
        <div style={{ textAlign: "center", marginBottom: 22 }}>
          <div style={{ width: 60, height: 60, borderRadius: "50%", background: "#FEF3EC", display: "flex", alignItems: "center", justifyContent: "center", margin: "0 auto 14px", fontSize: 26 }}>{actual.icono}</div>
          <div style={{ fontSize: 15, fontWeight: 600, color: "#1A1A1A", marginBottom: 6 }}>{actual.titulo}</div>
          <div style={{ fontSize: 12.5, color: "#5A6A78", lineHeight: 1.5 }}>{actual.texto}</div>
        </div>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
          <button onClick={onCerrar} style={{ background: "transparent", border: "none", color: "#9aa5b1", fontSize: 12.5, cursor: "pointer" }}>Omitir</button>
          <button onClick={() => ultimo ? onCerrar() : setPaso(p => p + 1)} style={{ background: "#E85D20", color: "#fff", border: "none", borderRadius: 8, padding: "10px 22px", fontSize: 13.5, fontWeight: 500, cursor: "pointer" }}>{ultimo ? "Empezar" : "Siguiente"}</button>
        </div>
        <div style={{ textAlign: "center", fontSize: 11, color: "#bbb", marginTop: 12 }}>Paso {paso + 1} de {pasos.length}</div>
      </div>
    </div>
  );
}

// ─── MIS TRABAJOS ──────────────────────────────────────────────────────────────
function MisTrabajos() {
  const [remitos, setRemitos] = useState([]);
  const [mostrarHistorial, setMostrarHistorial] = useState(false);
  const [confirmAccion, setConfirmAccion] = useState(null);

  useEffect(() => fbListen('remitos', arr => setRemitos(arr)), []);

  const mios = remitos.filter(r => r.esFletero && r.fleteroId === USUARIO_FLETERO?.id);
  const activos = mios.filter(r => r.estado !== "entregado").sort((a, b) => b.id.localeCompare ? b.id.localeCompare(a.id) : 0);
  const entregados = mios.filter(r => r.estado === "entregado");

  function irARetirar(r) {
    setConfirmAccion({
      titulo: "¿Salís a retirar el paquete?",
      subtitulo: r.remitente?.domicilio,
      textoBoton: "Sí, salgo a retirar",
      onConfirmar: () => { fbUpdate('remitos', r.id, { estado: "retirado" }); setConfirmAccion(null); },
    });
  }
  function salirAEntregar(r) {
    setConfirmAccion({
      titulo: "¿Salís a entregar?",
      subtitulo: r.destinatario?.domicilio,
      textoBoton: "Sí, salgo a entregar",
      onConfirmar: () => { fbUpdate('remitos', r.id, { estado: "en-camino" }); setConfirmAccion(null); },
    });
  }
  function marcarEntregado(r) {
    setConfirmAccion({
      titulo: "¿Confirmás que ya entregaste?",
      subtitulo: r.destinatario?.domicilio,
      textoBoton: "Sí, confirmar entrega",
      onConfirmar: () => { fbUpdate('remitos', r.id, { estado: "entregado" }); setConfirmAccion(null); },
    });
  }

  return (
    <>
    <div style={{ maxWidth: 680, margin: "0 auto", padding: "24px 16px" }}>
      <h1 style={{ fontSize: 20, fontWeight: 600, marginBottom: 20 }}>Mis trabajos</h1>

      {activos.length === 0 && entregados.length === 0 && (
        <div className="card" style={{ textAlign: "center", padding: 40, color: "#aaa" }}>
          <div style={{ fontSize: 32, marginBottom: 8 }}>🗂️</div>
          Todavía no tenés trabajos aceptados.
        </div>
      )}

      {activos.length > 0 && (
        <div style={{ marginBottom: 24 }}>
          <h3 style={{ fontSize: 12, fontWeight: 600, color: "#888", textTransform: "uppercase", letterSpacing: "0.04em", marginBottom: 10 }}>En curso</h3>
          <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
            {activos.map(r => (
              <div key={r.id} className="card">
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
                  <span style={{ fontWeight: 500, fontSize: 14 }}>{r.empresaNombre}</span>
                  <span className={`badge ${r.estado === "en-camino" ? "badge-en-camino" : r.estado === "retirado" ? "badge-activo" : "badge-nueva"}`}>
                    {r.estado === "en-camino" ? "En camino" : r.estado === "retirado" ? "Retirado" : "Pendiente de retiro"}
                  </span>
                </div>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 8, fontSize: 12.5, color: "#5A6A78", marginBottom: 4 }}>
                  <span>📍 Retiro: {r.remitente?.domicilio}</span>
                  {mapsUrl(r.remitente?.domicilio, r.remitente?.ciudad) && (
                    <a href={mapsUrl(r.remitente?.domicilio, r.remitente?.ciudad)} target="_blank" rel="noreferrer" style={{ color: "#2563EB", fontSize: 11, fontWeight: 600, textDecoration: "none", whiteSpace: "nowrap", flexShrink: 0 }}>Ver en Maps</a>
                  )}
                </div>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 8, fontSize: 12.5, color: "#5A6A78", marginBottom: 12 }}>
                  <span>🏁 Entrega: {r.destinatario?.domicilio}</span>
                  {mapsUrl(r.destinatario?.domicilio, r.destinatario?.ciudad) && (
                    <a href={mapsUrl(r.destinatario?.domicilio, r.destinatario?.ciudad)} target="_blank" rel="noreferrer" style={{ color: "#2563EB", fontSize: 11, fontWeight: 600, textDecoration: "none", whiteSpace: "nowrap", flexShrink: 0 }}>Ver en Maps</a>
                  )}
                </div>
                {r.estado === "pendiente-retiro" && (
                  <button className="btn-primary" style={{ width: "100%" }} onClick={() => irARetirar(r)}>Ir a retirar</button>
                )}
                {r.estado === "retirado" && (
                  <button className="btn-primary" style={{ width: "100%" }} onClick={() => salirAEntregar(r)}>Salí a entregar</button>
                )}
                {r.estado === "en-camino" && (
                  <button className="btn-primary" style={{ width: "100%" }} onClick={() => marcarEntregado(r)}>Marcar entregado</button>
                )}
              </div>
            ))}
          </div>
        </div>
      )}

      {entregados.length > 0 && (
        <div>
          <button
            onClick={() => setMostrarHistorial(v => !v)}
            style={{ width: "100%", background: "#639922", color: "#fff", border: "none", borderRadius: 8, padding: "10px 0", fontSize: 13.5, fontWeight: 500, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", gap: 6 }}
          >
            {mostrarHistorial ? "Ocultar historial ▲" : `Historial (${entregados.length}) ▾`}
          </button>
          {mostrarHistorial && (
            <div style={{ display: "flex", flexDirection: "column", gap: 8, marginTop: 12 }}>
              {entregados.map(r => (
                <div key={r.id} className="card" style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                  <span style={{ fontSize: 13.5 }}>{r.empresaNombre}</span>
                  <span className="badge badge-entregado">✓ Entregado</span>
                </div>
              ))}
            </div>
          )}
        </div>
      )}
    </div>
    {confirmAccion && (
      <ConfirmModal
        titulo={confirmAccion.titulo}
        subtitulo={confirmAccion.subtitulo}
        textoBoton={confirmAccion.textoBoton}
        onConfirmar={confirmAccion.onConfirmar}
        onCancelar={() => setConfirmAccion(null)}
      />
    )}
    </>
  );
}

// ─── CALIFICACIÓN POST-ENTREGA ─────────────────────────────────────────────────
function RatingModal({ remito, pregunta, nombre, onCalificar, onOmitir, accentColor }) {
  const [estrellas, setEstrellas] = useState(0);
  const [hover, setHover] = useState(0);
  return (
    <div style={{ position: "fixed", top: 0, left: 0, right: 0, bottom: 0, background: "rgba(0,0,0,0.5)", zIndex: 300, display: "flex", alignItems: "center", justifyContent: "center", padding: 20 }}>
      <div style={{ background: "#fff", borderRadius: 16, padding: "24px 20px", width: "100%", maxWidth: 340, textAlign: "center" }}>
        <div style={{ fontSize: 40, marginBottom: 8 }}>✅</div>
        <div style={{ fontWeight: 600, fontSize: 16, color: "#1A1A1A", marginBottom: 4 }}>¡Trabajo entregado!</div>
        <div style={{ borderTop: "1px solid #f0f0f0", paddingTop: 16, marginTop: 8 }}>
          <div style={{ fontSize: 14, color: "#444", marginBottom: 12 }}>{pregunta} <strong>{nombre}</strong>?</div>
          <div style={{ display: "flex", justifyContent: "center", gap: 6, marginBottom: 16 }}>
            {[1,2,3,4,5].map(n => (
              <span key={n} onClick={() => setEstrellas(n)} onMouseEnter={() => setHover(n)} onMouseLeave={() => setHover(0)}
                style={{ fontSize: 34, cursor: "pointer", color: n <= (hover || estrellas) ? accentColor : "#ddd", userSelect: "none" }}>★</span>
            ))}
          </div>
          <button disabled={estrellas === 0} onClick={() => onCalificar(estrellas)}
            style={{ background: estrellas > 0 ? accentColor : "#ccc", color: "#fff", border: "none", borderRadius: 8, padding: "10px 0", fontSize: 14, fontWeight: 500, cursor: estrellas > 0 ? "pointer" : "default", width: "100%", marginBottom: 8 }}>
            Enviar calificación
          </button>
          <button onClick={onOmitir} style={{ background: "transparent", border: "none", color: "#bbb", fontSize: 12, cursor: "pointer" }}>Omitir</button>
        </div>
      </div>
    </div>
  );
}

// ─── APP ────────────────────────────────────────────────────────────────────
function App() {
  const [registrado, setRegistrado] = useState(!!USUARIO_FLETERO);
  const [screen, setScreen] = useState("inicio");
  const [cargaCotizando, setCargaCotizando] = useState(null);
  const [remitoACalificar, setRemitoACalificar] = useState(null);
  const [mostrarTutorial, setMostrarTutorial] = useState(() => !storageGet(KEY_TUTORIAL_FLETERO, false));
  const shownRating = useRef(new Set());
  const pedidosVistos = useRef(null);
  const remitosVistos = useRef(null);

  useEffect(() => {
    if (!registrado) return;
    return fbListen('remitos', arr => {
      const pendiente = arr.find(r =>
        r.esFletero && r.fleteroId === USUARIO_FLETERO?.id &&
        r.estado === "entregado" &&
        r.calificacionTransportista == null &&
        !shownRating.current.has(r.id)
      );
      if (pendiente) {
        shownRating.current.add(pendiente.id);
        setRemitoACalificar(pendiente);
      }
    });
  }, [registrado]);

  // Pedir permiso de notificaciones al abrir la app
  useEffect(() => { pedirPermisoNotificaciones(); }, []);

  // Sonido cuando aparece un pedido nuevo elegible (dentro del radio de 30km)
  useEffect(() => {
    if (!registrado) return;
    return fbListen('cargas', arr => {
      const elegibles = arr.filter(c =>
        c.tipoEnvio === "expres-local" &&
        ["nueva", "activo"].includes(c.estado) &&
        pedidoEsElegibleParaFletero(c, USUARIO_FLETERO)
      );
      if (pedidosVistos.current === null) {
        // Primera carga: solo registrar lo que ya existe, sin sonar.
        pedidosVistos.current = new Set(elegibles.map(c => c.id));
        return;
      }
      elegibles.forEach(c => {
        if (!pedidosVistos.current.has(c.id)) {
          pedidosVistos.current.add(c.id);
          mostrarNotificacion('📦 Nuevo pedido disponible', `Hay un flete nuevo cerca de ${USUARIO_FLETERO?.ciudad || "tu ciudad"}`);
        }
      });
    });
  }, [registrado]);

  // Sonido cuando el cliente acepta una cotización (se crea el remito)
  useEffect(() => {
    if (!registrado) return;
    return fbListen('remitos', arr => {
      const mios = arr.filter(r => r.esFletero && r.fleteroId === USUARIO_FLETERO?.id);
      if (remitosVistos.current === null) {
        remitosVistos.current = new Set(mios.map(r => r.id));
        return;
      }
      mios.forEach(r => {
        if (!remitosVistos.current.has(r.id)) {
          remitosVistos.current.add(r.id);
          mostrarNotificacion('🎉 ¡Te aceptaron una cotización!', `Tenés un flete confirmado en ${r.remitente?.ciudad || "tu ciudad"}`);
        }
      });
    });
  }, [registrado]);

  function onNav(id) {
    setCargaCotizando(null);
    setScreen(id);
  }
  function onCotizar(carga) {
    setCargaCotizando(carga);
    setScreen("cotizar");
  }
  function calificar(estrellas) {
    if (remitoACalificar) fbUpdate('remitos', remitoACalificar.id, { calificacionTransportista: estrellas });
    setRemitoACalificar(null);
  }
  function omitirCalificacion() {
    if (remitoACalificar) fbUpdate('remitos', remitoACalificar.id, { calificacionTransportista: 0 });
    setRemitoACalificar(null);
  }

  function handleLoginDone(perfilFirebase) {
    USUARIO_FLETERO = perfilFirebase;
    storageSave(KEY_FLETERO_PERFIL, perfilFirebase);
    identificarFleteroEnOneSignal(perfilFirebase.id);
    setRegistrado(true);
  }

  if (!registrado) {
    return <RegistroFletero onListo={() => setRegistrado(true)} onLogueado={handleLoginDone} />;
  }

  return (
    <div>
      <NavbarFletero onNav={onNav} screen={screen} />
      {screen === "inicio" && <InicioFletero onNav={onNav} />}
      {screen === "pedidos-disponibles" && <PedidosDisponibles onNav={onNav} onCotizar={onCotizar} />}
      {screen === "cotizar" && cargaCotizando && <CotizarPedido carga={cargaCotizando} onNav={onNav} />}
      {screen === "mis-trabajos" && <MisTrabajos />}

      {remitoACalificar && (
        <RatingModal
          remito={remitoACalificar}
          pregunta="¿Cómo calificás a"
          nombre={remitoACalificar.empresaNombre}
          accentColor="#2563EB"
          onCalificar={calificar}
          onOmitir={omitirCalificacion}
        />
      )}

      {mostrarTutorial && (
        <TutorialInicial
          pasos={PASOS_TUTORIAL_FLETERO}
          onCerrar={() => { storageSave(KEY_TUTORIAL_FLETERO, true); setMostrarTutorial(false); }}
        />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

</script>
</body>
